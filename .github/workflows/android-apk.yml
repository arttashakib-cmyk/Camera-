name: Build Debug APK from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        id: extract
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repository root"
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          rm -rf /tmp/proj && mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
          SETTINGS=$(find /tmp/proj -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found inside the ZIP"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project directory: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.extract.outputs.dir }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing -> generating wrapper with Gradle 8.7"
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Run unit tests
        working-directory: ${{ steps.extract.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ steps.extract.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        id: apk
        run: |
          APK=$(find "${{ steps.extract.outputs.dir }}/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Debug APK was not produced by Gradle"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/CameraDiagnosticLab-debug-run${{ github.run_number }}.apk"
          echo "path=dist/CameraDiagnosticLab-debug-run${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraDiagnosticLab-debug-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-reports
          path: |
            /tmp/proj/**/app/build/reports/
            /tmp/proj/**/app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: success()
        run: |
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **CameraDiagnosticLab-debug-APK** from the Artifacts section at the bottom of this page." >> "$GITHUB_STEP_SUMMARY"
