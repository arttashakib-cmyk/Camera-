name: Build Nirvana APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (folder or zip)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(ls ./*.zip | head -n1)
            echo "Using $ZIP"
            mkdir -p _proj && unzip -q "$ZIP" -d _proj
            D=$(dirname "$(find _proj -name settings.gradle.kts | head -n1)")
            echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > "${{ env.PROJECT_DIR }}/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure signing keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f app/nirvana.keystore ]; then
            keytool -genkeypair -keystore app/nirvana.keystore -storepass nirvana123 -keypass nirvana123 \
              -alias nirvana -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Nirvana, O=Nirvana, C=IR"
          fi

      - name: Download Vazirmatn font (optional)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          D=app/src/main/assets/fonts
          mkdir -p $D
          for W in Regular Bold; do
            curl -fsSL --retry 2 -o $D/Vazirmatn-$W.ttf "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-$W.ttf" || true
            if [ -f $D/Vazirmatn-$W.ttf ] && [ "$(stat -c%s $D/Vazirmatn-$W.ttf)" -lt 50000 ]; then rm -f $D/Vazirmatn-$W.ttf; fi
          done

      - name: Patch Room schema export
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i '/room.schemaLocation/d' app/build.gradle.kts
          sed -i 's/exportSchema = true/exportSchema = false/' app/src/main/java/com/nirvana/app/data/AppDatabase.kt

      - name: Build APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          code=0
          gradle assembleRelease assembleDebug --no-daemon > build.log 2>&1 || code=$?
          grep -E "^e: " build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
          grep -A8 "What went wrong" build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk" out/Nirvana.apk
          cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" out/Nirvana-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nirvana-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nirvana build ${{ github.run_number }}
          files: out/Nirvana.apk
